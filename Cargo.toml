[package]
name = "yaav"
version = "0.1.0"
description = "Yet Another Alignment Viewer. Fast. Reliable. Essential."
authors = ["Alessandro Sartori <alex.sartori1997@gmail.com>"]
license = "Beerware"
keywords = ["alignment viewer", "bioinformatics", "fasta"]
edition = "2024"

[dependencies]
iced = { version = "0.14.0", features = ["canvas", "lazy"] }
iced_font_awesome = "0.4.4"
keybinds = { git = "https://github.com/podzolelements/keybinds-rs", branch = "iced_0.14.0", features = ["iced"] }
rfd = "0.18.0"

[profile.release]
strip = true
lto = true
codegen-units = 1

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
