name: Compile and release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  BINARY_NAME: yaav

jobs:
  build-and-release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_name: linux-x86_64
            ext: ""
          - os: macos-latest # Apple Silicon (M1/M2/M3/M4)
            target: aarch64-apple-darwin
            asset_name: macos-aarch64
            ext: ""
          - os: macos-latest # Intel Mac (cross-compiled)
            target: x86_64-apple-darwin
            asset_name: macos-x86_64
            ext: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_name: windows-x86_64
            ext: ".exe"

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package binary
        shell: bash
        run: |
          BIN_PATH="target/${{ matrix.target }}/release/${{ env.BINARY_NAME }}${{ matrix.ext }}"
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            7z a "${{ env.BINARY_NAME }}-${{ matrix.asset_name }}.zip" "$BIN_PATH"
          else
            tar -czf "${{ env.BINARY_NAME }}-${{ matrix.asset_name }}.tar.gz" -C "target/${{ matrix.target }}/release" "${{ env.BINARY_NAME }}"
          fi

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.BINARY_NAME }}-${{ matrix.asset_name }}.tar.gz
            ${{ env.BINARY_NAME }}-${{ matrix.asset_name }}.zip
